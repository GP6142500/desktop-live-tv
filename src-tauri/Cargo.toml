[package]
name = "tv-live-app"
version = "0.1.0"
description = "Windows 桌面电视直播应用 (Tauri 2 + Next.js)"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地代理：把 IPTV 直播流同源转发给前端，绕过浏览器 CORS 与 mixed-content 限制
tokio = { version = "1", features = ["full"] }
axum = "0.8"
# default-features=false 去除 openssl 系统依赖，改用纯 Rust 的 rustls
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
urlencoding = "2"

[features]
# 按硬件特性开启的 feature flag（参考 ui.md，用于后续可选的 ML sidecar）
# AMD / Intel 走 vulkan，Apple 走 metal + coreml
default = []
cuda = []
vulkan = []
metal = []
coreml = []
openblas = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
